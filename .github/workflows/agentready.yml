# AgentReady check on a pull request, only when the PR has the label "agentready" (every run spends real agent steps,
# about $0.016 each). Also runnable by hand with any address. Needs the repository secret TINYFISH_API_KEY; without it
# the job says so and finishes green ("skipped").
name: AgentReady

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      url:
        description: Public address to test (empty = the production demo store with flaws on)
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write   # the one PR comment
  deployments: read      # find the Vercel preview of this commit

jobs:
  agentready:
    name: Can AI agents use this site?
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PR: only with the label (a different label being added does not start a run). Manual: always.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'agentready') &&
       (github.event.action != 'labeled' || github.event.label.name == 'agentready'))
    # One run per PR; a newer push replaces the old run. Cancelling sends the CLI a stop signal, which cancels its agent runs on TinyFish.
    concurrency:
      group: agentready-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      PROD_DEMO_URL: https://agent-ready-demo.vercel.app/?flaws=on
    steps:
      - name: Check for the TinyFish key
        id: key
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          if [ -n "$TINYFISH_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AgentReady skipped: the repository secret TINYFISH_API_KEY is not set (forks and Dependabot PRs never get secrets). Add it under Settings > Secrets and variables > Actions."
            echo "### AgentReady skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository secret \`TINYFISH_API_KEY\` is not available to this run, so no agents were started." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the action
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4.2.2

      - name: Pick the address to test
        id: target
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -uo pipefail
          pick() { echo "url=$1" >> "$GITHUB_OUTPUT"; echo "Testing: $1"; exit 0; }
          if [ -n "${INPUT_URL:-}" ]; then pick "$INPUT_URL"; fi
          if [ -z "${SHA:-}" ]; then pick "$PROD_DEMO_URL"; fi
          # Vercel posts a deployment (with a success status and the preview address) for the commit. Wait up to 5 minutes.
          for i in $(seq 1 30); do
            preview=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=10" --jq '.[].id' 2>/dev/null | while read -r id; do
              gh api "repos/$REPO/deployments/$id/statuses?per_page=5" --jq 'map(select(.state=="success" and (.environment_url // "" | startswith("https://")))) | .[0].environment_url // empty' 2>/dev/null
            done | head -n1)
            if [ -n "$preview" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$preview" || echo 000)
              if [ "$code" = "200" ]; then pick "$preview"; fi
              echo "::notice::Vercel preview $preview answered HTTP $code (a locked preview cannot be reached by cloud agents). Using the production demo store."
              pick "$PROD_DEMO_URL"
            fi
            sleep 10
          done
          echo "::notice::No Vercel preview appeared within 5 minutes. Using the production demo store."
          pick "$PROD_DEMO_URL"

      - name: AgentReady
        if: steps.key.outputs.present == 'true'
        uses: ./
        with:
          url: ${{ steps.target.outputs.url }}
          tinyfish-api-key: ${{ secrets.TINYFISH_API_KEY }}
          pack: shop
          tasks: find_price,add_to_cart
          min-score: '0'
