name: AgentReady
description: Test whether AI agents can really use your site - shop, SaaS, blog or local business (find a price, sign up, read an article, book a table). Posts one PR comment, a job summary and a badge.
author: Team Mavericks
branding:
  icon: check-circle
  color: green

inputs:
  url:
    description: Address of the site to test. It must be public (TinyFish cloud agents cannot reach localhost); a preview deployment works.
    required: true
  tinyfish-api-key:
    description: TinyFish API key. Pass it from a repository secret, never as plain text.
    required: true
  pack:
    description: What kind of site this is - auto (read the site and pick), shop, saas, content (blog or news) or local (restaurant, clinic, salon). auto adds one Instant Scan before the agents start.
    required: false
    default: auto
  tasks:
    description: Comma separated task ids from any pack (for example find_price,add_to_cart or find_pricing_plans,reach_signup), or quick (the two key tasks of the pack), or none (only the task input). Every agent step costs about $0.016.
    required: false
    default: quick
  task:
    description: A task of your own in plain words (up to 300 characters). It is scored separately and is not part of the 100. Leave empty for none.
    required: false
    default: ''
  min-score:
    description: Fail the job when the score is below this number (0 to 100). 0 means report only.
    required: false
    default: '0'
  comment:
    description: Post (or update) one comment on the pull request.
    required: false
    default: 'true'
  github-token:
    description: Token used for the PR comment (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  cli-version:
    description: Version of @agentready/cli from npm (for example 0.1.0 or latest). Empty = build the CLI from this action's own source.
    required: false
    default: ''

outputs:
  score:
    description: The score (0 to 100), empty when the test could not finish.
    value: ${{ steps.report.outputs.score }}
  passed:
    description: 'true when the score reached min-score.'
    value: ${{ steps.report.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4.1.0
      with:
        node-version: '20'

    - name: Install the AgentReady CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$CLI_VERSION" ]; then
          npm install --prefix "$RUNNER_TEMP/agentready" --no-audit --no-fund "@agentready/cli@$CLI_VERSION"
          echo "AGENTREADY_BIN=$RUNNER_TEMP/agentready/node_modules/.bin/agentready" >> "$GITHUB_ENV"
        else
          # Same self-contained folder that gets published to npm.
          (cd "$ACTION_PATH" && node scripts/pack-cli.mjs dist/cli)
          (cd "$ACTION_PATH/dist/cli" && npm install --omit=dev --no-audit --no-fund)
          echo "AGENTREADY_BIN=$ACTION_PATH/dist/cli/bin/agentready.js" >> "$GITHUB_ENV"
        fi

    - name: Run the agents
      id: run
      shell: bash
      env:
        TINYFISH_API_KEY: ${{ inputs.tinyfish-api-key }}
        TARGET_URL: ${{ inputs.url }}
        TASKS: ${{ inputs.tasks }}
        PACK: ${{ inputs.pack }}
        TASK_TEXT: ${{ inputs.task }}
      run: |
        set -uo pipefail
        mkdir -p agentready-out
        case "$TARGET_URL" in http://*|https://*) ;; *) echo "::error::url must start with http:// or https://"; echo "exit=2" >> "$GITHUB_OUTPUT"; exit 0;; esac
        if ! [[ "$TASKS" =~ ^[a-z_]+(,[a-z_]+)*$ ]]; then echo "::error::tasks must look like find_price,add_to_cart (or quick, or none)"; echo "exit=2" >> "$GITHUB_OUTPUT"; exit 0; fi
        if ! [[ "$PACK" =~ ^(auto|shop|saas|content|local)$ ]]; then echo "::error::pack must be auto, shop, saas, content or local"; echo "exit=2" >> "$GITHUB_OUTPUT"; exit 0; fi
        # The task text goes to the CLI as one argument (never through the shell text), and the CLI checks its length.
        extra=()
        if [ -n "$TASK_TEXT" ]; then extra+=(--task "$TASK_TEXT"); fi
        echo "::add-mask::$TINYFISH_API_KEY"
        # Run in the background so a cancelled job (runner sends SIGINT, then SIGTERM) passes the signal on: the CLI then
        # cancels its agent runs on TinyFish so they stop costing money.
        node "${AGENTREADY_BIN}" "$TARGET_URL" --no-tunnel --json --pack "$PACK" --tasks "$TASKS" ${extra[@]+"${extra[@]}"} --badge agentready-out/agentready-badge.svg \
          > agentready-out/agentready-report.json 2> agentready-out/progress.log &
        pid=$!
        trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 143' INT TERM
        wait "$pid"; code=$?
        trap - INT TERM
        cat agentready-out/progress.log || true
        echo "exit=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Write the report
      id: report
      if: always() && steps.run.outcome != 'skipped'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MIN_SCORE: ${{ inputs.min-score }}
        TARGET_URL: ${{ inputs.url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_EXIT: ${{ steps.run.outputs.exit }}
      run: |
        set -uo pipefail
        mkdir -p agentready-out
        [ -s agentready-out/agentready-badge.svg ] || node -e "import('$ACTION_PATH/packages/engine/src/badge.js').then(m=>process.stdout.write(m.badgeSvg({score:'error'})))" > agentready-out/agentready-badge.svg
        err=""; [ "$RUN_EXIT" = "0" ] || err="the CLI exited with code $RUN_EXIT"
        node "$ACTION_PATH/scripts/ci-report.mjs" agentready-out/agentready-report.json \
          --min-score "$MIN_SCORE" --target "$TARGET_URL" --run-url "$RUN_URL" --error "$err" \
          --comment agentready-out/comment.md --summary "$GITHUB_STEP_SUMMARY"

    - name: Post or update the PR comment
      if: always() && steps.report.outcome == 'success' && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7.0.1
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('agentready-out/comment.md', 'utf8');
          const marker = '<!-- agentready -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker) && c.user && c.user.type === 'Bot');
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
          } catch (e) {
            // Pull requests from forks get a read-only token. The job summary still has the report.
            core.warning(`Could not post the PR comment: ${e.message}`);
          }

    - name: Upload the report and badge
      if: always() && steps.report.outcome == 'success'
      uses: actions/upload-artifact@v4.4.3
      with:
        name: agentready-report
        path: |
          agentready-out/agentready-report.json
          agentready-out/agentready-badge.svg
          agentready-out/comment.md
        if-no-files-found: warn

    - name: Fail below the minimum score
      if: always() && steps.report.outcome == 'success'
      shell: bash
      env:
        PASSED: ${{ steps.report.outputs.passed }}
        SCORE: ${{ steps.report.outputs.score }}
        MIN_SCORE: ${{ inputs.min-score }}
      run: |
        if [ "$PASSED" != "true" ]; then
          if [ -z "$SCORE" ]; then echo "::error::AgentReady could not finish the test, so there is no score."
          else echo "::error::AgentReady score $SCORE is below the minimum $MIN_SCORE."; fi
          exit 1
        fi
