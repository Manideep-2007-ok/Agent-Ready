<h1>Contact us</h1>
<p>Email: <a href="mailto:support@chaiandco.example">support@chaiandco.example</a><br>Phone: +91 80 4000 1234 (Mon-Sat, 9am-6pm IST)</p>
<h2>Send us a message</h2>

<label for="e">Email</label><input id="e" name="email" type="email" required>

<p><button class="btn" type="submit">Send message</button></p>
</form>
